# .github/workflows/ci.yml
name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - docker_ci # This workflow triggers only on pushes to the docker_ci branch

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python environment and install dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies for training
        run: pip install -r requirements.txt

      - name: Run train.py to generate model file
        run: python train.py

      - name: Build Docker image
        run: docker build -t surbhi046/mlops-assignment3:latest .
        # Your Docker Hub username: surbhi046
        # Your Image name: mlops-assignment3

      - name: Run Docker container and execute verification script
        run: docker run surbhi046/mlops-assignment3:latest python predict.py
        # This runs the container from the image you just built and tagged

  push_to_dockerhub:
    needs: build_and_test_container # This job runs ONLY if the previous job (build_and_test_container) succeeds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # Fetches username from GitHub Secret
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # Fetches token from GitHub Secret
          # DO NOT replace ${{ secrets.DOCKERHUB_TOKEN }} with your actual token here!

      - name: Build and Push Docker image to Docker Hub
        run: |
          docker build -t surbhi046/mlops-assignment3:latest .
          docker push surbhi046/mlops-assignment3:latest
